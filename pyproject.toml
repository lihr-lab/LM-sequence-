[project]
name = "gateway-sequence-rules"
version = "0.1.0"
description = "Gateway log sequence clustering and LLM rule-template generation pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "scikit-learn>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
